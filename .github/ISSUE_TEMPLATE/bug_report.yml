name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where are you running it?
      options: [Web (Chrome), Web (Edge), Web (other browser), Windows desktop app, Linux desktop app]
    validations:
      required: true
  - type: dropdown
    id: controller
    attributes:
      label: Controller
      options: [DualSense USB, DualSense Bluetooth, DualSense Edge, Other controller, Keyboard only]
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings & Data.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors

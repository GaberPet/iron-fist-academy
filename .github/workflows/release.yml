name: Release desktop builds

# Push a tag like v0.2.0: GitHub builds the Windows installer + portable .exe and the Linux AppImage
# from the public code, smoke-tests them and publishes them as the latest release. The website's
# "Install the app" page links to releases/latest/download/<file>, so file names stay fixed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer and portable exe
        run: npm run dist:win
      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $env:IFA_SMOKE = '1'
          $env:IFA_SMOKE_OUT = "$env:RUNNER_TEMP\smoke.json"
          $p = Start-Process -FilePath "release\win-unpacked\Iron Fist Academy.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Smoke test timed out' }
          Get-Content $env:IFA_SMOKE_OUT
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build AppImage
        run: npm run dist:linux
      - name: Smoke-test the packaged app
        run: |
          IFA_SMOKE=1 IFA_SMOKE_OUT="$RUNNER_TEMP/smoke.json" timeout 120 xvfb-run -a release/linux-unpacked/iron-fist-academy --no-sandbox
          cat "$RUNNER_TEMP/smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*.AppImage

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest --generate-notes \
            --title "Iron Fist Academy $GITHUB_REF_NAME" out/*
